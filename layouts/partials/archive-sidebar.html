<aside class="archive-sidebar" aria-label="{{ i18n "nav_primary" }}">
  <a class="archive-sidebar__brand" href="{{ site.Home.RelPermalink }}">{{ site.Params.blogTitle | default site.Title }}</a>
  {{ with site.Params.description }}<p class="archive-sidebar__intro">{{ . }}</p>{{ end }}
  <nav class="archive-sidebar__nav">
    <a class="archive-sidebar__link{{ if .IsHome }} is-current{{ end }}" href="{{ site.Home.RelPermalink }}">{{ i18n "latest_posts" }}</a>
    {{ range site.Menus.main }}
      {{ $current := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
      <a class="archive-sidebar__link{{ if $current }} is-current{{ end }}" href="{{ .URL | relURL }}">{{ .Name }}</a>
    {{ end }}
  </nav>
</aside>
